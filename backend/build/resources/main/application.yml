server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./backend-data/whatsapp;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: "this_is_a_demo_secret_key_for_whatsapp_backend_change_me_123456"
    expiry-seconds: 86400


